memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  messageWindowSize: 8
  agent:
    enabled: true
    provider: Deepseek
    model: deepseek-flash

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: deepseek-flash
      label: DeepSeek Flash
      default: true
      memory: true
      webSearch: true
      mcpServers:
        - firecrawl
      description: DeepSeek Flash
      preset:
        endpoint: Deepseek
        model: deepseek-flash
    - name: deepseek-v4-pro
      label: DeepSeek V4 Pro
      memory: true
      webSearch: true
      mcpServers:
        - firecrawl
      description: DeepSeek V4 Pro
      preset:
        endpoint: Deepseek
        model: deepseek-v4-pro

endpoints:
  custom:
    - name: "Deepseek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default: ["deepseek-flash", "deepseek-v4-pro"]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-flash"
      modelDisplayLabel: "Deepseek"

webSearch:
  searchProvider: searxng
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngSearchOptions:
    engines:
      - duckduckgo web
      - mwmbl
      - wikipedia
    timeout: 8000
  scraperProvider: firecrawl
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlVersion: "${FIRECRAWL_VERSION}"
  scraperTimeout: 15000
  rerankerType: none
  safeSearch: 1
  allowedAddresses:
    - searxng:8080
  firecrawlOptions:
    formats: ["markdown"]
    onlyMainContent: true
    blockAds: true
    removeBase64Images: true
    storeInCache: true
    maxAge: 172800000
    timeout: 15000

mcpSettings:
  allowedAddresses:
    - upscale:8788

mcpServers:
  firecrawl:
    title: Firecrawl
    type: streamable-http
    url: https://mcp.firecrawl.dev/v2/mcp
    headers:
      Authorization: "Bearer ${FIRECRAWL_API_KEY}"
    chatMenu: true
    serverInstructions: true
    timeout: 60000
    initTimeout: 20000
  upscale:
    type: streamable-http
    url: http://upscale:8788/mcp
    serverInstructions: true
    timeout: 600000
    initTimeout: 20000
