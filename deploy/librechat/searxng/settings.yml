use_default_settings:
  engines:
    keep_only:
      - duckduckgo web
      - mwmbl
      - wikipedia

server:
  # up.sh writes the real key into SEARXNG_SECRET. The container copies this file
  # and replaces the placeholder before SearXNG starts.
  secret_key: "change-me"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0

engines:
  - name: mwmbl
    disabled: false
